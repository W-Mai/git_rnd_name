[package]
name = "git_rnd_name"
version = "0.2.0"
edition = "2021"
description = "Generate a random git branch name based on remote name you given."
authors = ["BenginX", "X_Tu"]
license = "MIT"
repository = "https://github.com/W-Mai/git_rnd_name"
homepage = "https://github.com/W-Mai/git_rnd_name"

[package.metadata.wix]
upgrade-guid = "6E7CD699-1FC3-4CED-A35B-B6535861E191"
path-guid = "D9790029-487E-4212-9C56-B04A058DF38C"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "grn"
path = "src/main.rs"

[dependencies]
git2 = "0.19.0"
clap = { version = "4.5.7", features = ["derive"] }
anyhow = "1.0.86"
iterator-ext = "0.2.1"
thiserror = "1.0.61"
rand = "0.8.5"
log = "0.4.21"
env_logger = "0.11.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
